name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # wasm-gc is the library's preferred target; native exercises the C
        # backend (runners ship a C compiler); js the JavaScript backend.
        target: [wasm-gc, js, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@main
      - name: Update registry
        run: moon update
      - name: Type check
        run: moon check
      - name: Run tests
        run: moon test --target ${{ matrix.target }}
      - name: Build
        run: moon build --target ${{ matrix.target }}
